name: Build & Test Android

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Git2 + GitHub-Boss APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android Environment
        uses: ./.github/actions/setup-android

      - name: Verify merged sources
        shell: bash
        run: |
          test -f app/src/main/java/com/example/data/KotlinCodeMaker.kt
          test -f app/src/main/java/com/example/data/GeminiCodeService.kt
          test -f app/src/main/java/com/example/data/ProjectGenerator.kt

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Locate APK
        shell: bash
        run: find app/build/outputs -type f -name '*.apk' -print

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: git2-github-boss-combined-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
