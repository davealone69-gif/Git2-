name: 'Setup Android Environment'
description: 'Configures JDK 17, decodes debug keystore if present, and forces clean Gradle wrapper'

runs:
  using: 'composite'
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Regenerate Gradle Wrapper & Restore Keystore
      shell: bash
      run: |
        if [ -f "debug.keystore.base64" ]; then
          base64 -d debug.keystore.base64 > debug.keystore
        fi
        gradle wrapper --gradle-version 9.7.0
        chmod +x gradlew
