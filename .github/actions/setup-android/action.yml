name: 'Setup Android Environment'
description: 'Configures JDK 17, Android SDK, and Gradle 9.3.1'

runs:
  using: 'composite'
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Prepare Android SDK
      shell: bash
      run: |
        set -euo pipefail
        export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
        export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
        export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
        command -v sdkmanager
        sdkmanager --version

    - name: Accept Android licenses and install required packages
      shell: bash
      run: |
        set -euo pipefail
        yes | sdkmanager --licenses >/dev/null || true
        sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" || \
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

    - name: Install Gradle 9.3.1
      shell: bash
      run: |
        set -euo pipefail
        curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
        rm -rf /opt/gradle-9.3.1
        mkdir -p /opt/gradle-9.3.1
        unzip -q /tmp/gradle.zip -d /opt
        echo "/opt/gradle-9.3.1/bin" >> "$GITHUB_PATH"
        /opt/gradle-9.3.1/bin/gradle --version

    - name: Decode debug keystore if present
      shell: bash
      run: |
        if [ -f "debug.keystore.base64" ]; then
          base64 -d debug.keystore.base64 > debug.keystore
        fi
